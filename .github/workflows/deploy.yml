name: Déploiement Hostinger (thème cerer-child)

# Déclenchement manuel uniquement — bouton "Run workflow" dans l'onglet
# Actions de GitHub. Pas de trigger automatique sur push : l'utilisateur
# garde le contrôle sur le moment de chaque déploiement.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déploie le thème via SSH (rsync, clé dédiée)
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          SOURCE: 'wp-content/themes/cerer-child/'
          TARGET: ${{ secrets.REMOTE_PATH }}
          ARGS: '-avzr --delete'
